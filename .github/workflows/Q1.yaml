name: Q1
on:
  push:
    paths:
      - 'XYZ.txt'
      - '.github/workflows/Q1.yaml'

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les fichiers du dépôt
        uses: actions/checkout@v4

      - name: Copier XYZ.txt vers Q1_archive_XYZ.txt
        run: cp XYZ.txt Q1_archive_XYZ.txt

      - name: Pousser le nouveau fichier sur le dépôt
        run: |
          git config --global user.name "Lucas.Leprevost"
          git config --global user.email "lucas.leprevost@etu.univ-lehavre.fr"
          git add Q1_archive_XYZ.txt
          git commit --allow-empty -m "Archive Q1"
          git push
